[project]
name = "meow-qqbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.10.1",
    "croniter>=6.0.0",
    "deepseek-tokenizer>=0.3.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "openai[aiohttp]>=2.26.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.20",
    "psutil>=7.2.2",
    "qqbot-agent-sdk",
    "skillkit>=0.4.0",
    "uvicorn[standard]>=0.34.0",
    "hindsight-client>=0.8.4",
    "httpx>=0.27.0",
    "aiofiles>=25.1.0",
    "pydantic>=2.12.5",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.23",
    "pypdf>=6.15.0",
    "faster-whisper>=1.1.0",
    "pilk>=0.2.4",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
qqbot-agent-sdk = { git = "https://github.com/lizqwerscott/qqbot-agent-sdk", branch = "group-message-add" }

[tool.isort]
profile = "black"  # 与 black 的 88 列行宽对齐，避免 import 换行冲突
